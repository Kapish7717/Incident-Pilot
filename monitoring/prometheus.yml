global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "fastapi-app"
    metrics_path: /metrics

    static_configs:
      - targets: ["127.0.0.1:8000"]

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "127.0.0.1:9093"